<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sabibi 📍 סביבי - גלה את הסביבה שלך</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.98);
            --primary: #00c2e8;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --card-bg: #ffffff;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            --control-bg: #f8fafc;
            --border-color: #f1f5f9;
            --pill-bg: #f1f5f9;
            --border-radius: 18px;
        }

        body.dark-mode {
            --bg-main: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.98);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --card-bg: #1e293b;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            --control-bg: #334155;
            --border-color: #334155;
            --pill-bg: #334155;
        }

        * { box-sizing: border-box; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg-main); color: var(--text-main); transition: background 0.3s, color 0.3s; }
        body { display: flex; flex-direction: row; }

        #sidebar {
            width: 420px; min-width: 420px; padding: 24px;
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-color);
            z-index: 1000; overflow-y: auto; height: 100vh;
            box-shadow: 10px 0 30px rgba(0,0,0,0.04);
            transition: background 0.3s;
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .brand-logo { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: var(--text-main); }
        .brand-logo span { color: var(--primary); }

        .header-actions { display: flex; gap: 8px; align-items: center; }

        .theme-toggle-btn {
            background: var(--control-bg); border: 1px solid var(--border-color);
            color: var(--text-main); padding: 8px 12px; border-radius: 20px;
            cursor: pointer; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px;
        }

        .mood-container { display: flex; gap: 6px; margin-bottom: 16px; }
        .mood-btn {
            flex: 1; padding: 8px 4px; border-radius: 12px; background: var(--control-bg);
            border: 1px solid var(--border-color); color: var(--text-main); font-size: 11px;
            font-weight: 800; cursor: pointer; text-align: center; transition: all 0.2s;
        }
        .mood-btn:hover { border-color: var(--primary); }

        .pills-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 16px; }
        .pills-scroll { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px 0; width: 100%; scrollbar-width: thin; scroll-behavior: smooth; }
        .scroll-btn { background: var(--panel-bg); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px; font-weight: bold; z-index: 10; flex-shrink: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .pill { flex: 0 0 auto; padding: 8px 16px; border-radius: 30px; background: var(--pill-bg); color: var(--text-sub); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease; user-select: none; }
        .pill.active { background: var(--primary); color: #fff; }

        .control-card { background: var(--control-bg); padding: 16px; border-radius: var(--border-radius); margin-bottom: 16px; border: 1px solid var(--border-color); }
        .control-label { font-size: 13px; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 8px; }

        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 194, 232, 0.3); transition: transform 0.1s; }
        .btn-main:active { transform: scale(0.98); }

        .btn-secondary { padding: 8px 14px; background: var(--control-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; }

        #map { flex: 1; height: 100vh; width: 100%; z-index: 1; }

        .place-card { background: var(--card-bg); border-radius: var(--border-radius); padding: 0; margin-bottom: 20px; box-shadow: var(--card-shadow); overflow: hidden; border: 1px solid var(--border-color); transition: transform 0.2s ease; position: relative; }
        .place-card:hover { transform: translateY(-2px); }

        .img-container { width: 100%; height: 150px; background: #334155; position: relative; }
        .place-img { width: 100%; height: 100%; object-fit: cover; }

        .fav-btn { position: absolute; top: 12px; left: 12px; background: rgba(255,255,255,0.9); border: none; border-radius: 50%; width: 34px; height: 34px; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

        .badge-score { position: absolute; bottom: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px; }

        .card-body { padding: 14px; }
        .place-title { font-size: 17px; font-weight: 800; margin: 0 0 4px 0; color: var(--text-main); }
        .place-subtitle { font-size: 12px; color: var(--text-sub); margin: 0 0 10px 0; }

        .meta-row { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 700; color: var(--text-sub); flex-wrap: wrap; }
        .meta-item { display: flex; align-items: center; gap: 4px; background: var(--control-bg); padding: 4px 8px; border-radius: 8px; }

        .card-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-nav { flex: 2; padding: 10px; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; text-align: center; font-weight: 800; font-size: 13px; }
        .btn-share { flex: 1; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px); align-items: center; justify-content: center; padding: 16px; }
        .modal-content { background: var(--card-bg); color: var(--text-main); padding: 20px; border-radius: 24px; width: 100%; max-width: 380px; max-height: 90vh; overflow-y: auto; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.3); position: relative; }
        
        .wheel-container { position: relative; width: 220px; height: 220px; margin: 10px auto; }
        #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 6px 16px rgba(0,0,0,0.2); }
        .wheel-arrow { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 20px solid #ef4444; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }

        .match-actions { display: flex; gap: 12px; margin-top: 15px; }
        .match-btn-dislike { flex: 1; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; }
        .match-btn-like { flex: 1; padding: 12px; background: #10b981; color: white; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; }

        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #map { height: 100vh; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
            #sidebar { width: 100%; min-width: 100%; height: 55vh; position: absolute; bottom: 0; left: 0; right: 0; border-left: none; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 20px; }
            .drag-handle { width: 36px; height: 5px; background: #cbd5e1; border-radius: 10px; margin: 0 auto 16px auto; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="drag-handle"></div>
        <div class="header-row">
            <div class="brand-logo">Sabibi<span>.</span></div>
            <div class="header-actions">
                <button class="theme-toggle-btn" onclick="toggleDarkMode()">
                    <span id="themeIcon">🌙</span> <span id="themeText">כהה</span>
                </button>
                <button class="btn-secondary" onclick="locateMe()">🎯 המיקום שלי</button>
            </div>
        </div>

        <div class="mood-container">
            <button class="mood-btn" onclick="quickMood('cafe')">🥐 קפה וספונטני</button>
            <button class="mood-btn" onclick="quickMood('meat')">🥩 דייט לילי</button>
            <button class="mood-btn" onclick="quickMood('hotel')">🏨 סופ"ש קרוב</button>
        </div>

        <div class="pills-wrapper">
            <button class="scroll-btn" onclick="scrollPills(-120)" style="margin-left: 4px;">›</button>
            <div class="pills-scroll" id="pillsContainer">
                <div class="pill active" onclick="selectCategory('restaurant', this)">🍽️ הכל</div>
                <div class="pill" onclick="selectCategory('kosher', this)">📜 כשר</div>
                <div class="pill" onclick="selectCategory('italian', this)">🍕 איטלקי</div>
                <div class="pill" onclick="selectCategory('sushi', this)">🍣 סושי</div>
                <div class="pill" onclick="selectCategory('meat', this)">🥩 בשרים</div>
                <div class="pill" onclick="selectCategory('cafe', this)">☕ קפה</div>
                <div class="pill" onclick="selectCategory('bar', this)">🍹 בארים</div>
                <div class="pill" onclick="selectCategory('hotel', this)">🏨 מלונות</div>
                <div class="pill" onclick="selectCategory('attraction', this)">🎡 אטרקציות</div>
            </div>
            <button class="scroll-btn" onclick="scrollPills(120)" style="margin-right: 4px;">‹</button>
        </div>

        <div class="control-card">
            <div class="control-label">
                <span>רדיוס חיפוש</span>
                <span id="radiusVal" style="color:var(--primary);">2,000 מטר</span>
            </div>
            <input type="range" id="radiusSlider" min="200" max="15000" step="200" value="2000">

            <div class="control-label" style="margin-top: 14px;">
                <span>דירוג מינימלי</span>
                <span id="ratingVal" style="color:var(--primary);">4.0 ⭐</span>
            </div>
            <input type="range" id="ratingSlider" min="1.0" max="5.0" step="0.1" value="4.0">
        </div>

        <button class="btn-main" onclick="searchRestaurants()">חפש בסביבה</button>
        
        <div style="display:flex; gap:6px; margin-top:8px;">
            <button class="btn-secondary" style="flex:1; background: linear-gradient(135deg, #8b5cf6, #6d28d9); color:white; border:none;" onclick="openWheelModal()">🎡 גלגל המזל</button>
            <button class="btn-secondary" style="flex:1; background: linear-gradient(135deg, #ec4899, #be185d); color:white; border:none;" onclick="setupMatchGroup()">👥 מצב Match</button>
        </div>

        <button class="btn-secondary" style="width:100%; margin-top:6px; padding:10px; background:#6366f1; color:white; border:none;" onclick="showFavorites()">❤️ המועדפים שלי (<span id="favCount">0</span>)</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

        <div id="results">
            <p style="color: var(--text-sub); font-size: 13px; text-align: center;">בחר קטגוריה ולחץ על החיפוש...</p>
        </div>
    </div>

    <div id="map"></div>

    <!-- Modals -->
    <div id="randomModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color: var(--primary); font-size: 20px;">🎡 גלגל המזל של סביבי</h2>
            <div class="wheel-container">
                <div class="wheel-arrow"></div>
                <canvas id="wheelCanvas" width="220" height="220"></canvas>
            </div>
            <button id="spinBtn" class="btn-main" style="margin-top: 5px;" onclick="spinWheel()">סובב את הגלגל! 🚀</button>
            <div id="modalBody" style="margin-top: 10px;"></div>
            <button class="btn-secondary" style="margin-top: 10px; width: 100%;" onclick="closeModal()">סגור</button>
        </div>
    </div>

    <div id="matchModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color: #ec4899; font-size: 20px;">👥 Match קבוצתי</h2>
            <p id="matchProgress" style="font-size:12px; font-weight:800; color:var(--primary); margin:0 0 10px 0;"></p>
            <div id="matchCardBody" style="margin-top: 10px;"></div>
            <div id="matchActions" class="match-actions">
                <button class="match-btn-dislike" onclick="voteMatch(false)">👎 לא בא</button>
                <button class="match-btn-like" onclick="voteMatch(true)">👍 בא לי!</button>
            </div>
            <button id="nextUserBtn" class="btn-main" style="display:none; margin-top:15px; background:#ec4899;" onclick="startNextUserTurn()">העבר למשתתף הבא 📱➔</button>
            <button class="btn-secondary" style="margin-top: 12px; width: 100%;" onclick="closeMatchModal()">סגור</button>
        </div>
    </div>

    <script>
        const defaultLat = 32.0853;
        const defaultLng = 34.7818;
        let selectedGenre = 'restaurant';

        const map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 14);

        const lightTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { attribution: '© CARTO', maxZoom: 19 });
        const darkTile = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO', maxZoom: 19 });

        lightTile.addTo(map);

        let radius = 2000;
        let minRating = 4.0;
        let restaurantMarkers = [];
        let fetchedPlacesList = [];
        let favorites = JSON.parse(localStorage.getItem('sabibi_favs') || '[]');

        const icons = {
            italian: '🍕', sushi: '🍣', meat: '🥩', vegan_only: '🥗', kosher: '📜', cafe: '☕',
            bar: '🍹', hotel: '🏨', b_and_b: '🏡', attraction: '🎡', restaurant: '🍽️'
        };

        function updateFavCount() { document.getElementById('favCount').innerText = favorites.length; }
        updateFavCount();

        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: `<div style="font-size: 20px; background: white; border-radius: 50%; padding: 4px; box-shadow: 0 3px 10px rgba(0,0,0,0.25); width: 34px; height: 34px; display:flex; align-items:center; justify-content:center; border: 2px solid var(--primary);">${emoji}</div>`,
                className: '', iconSize: [34, 34], iconAnchor: [17, 17]
            });
        }

        let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
        let circle = L.circle([defaultLat, defaultLng], { radius: radius, color: '#00c2e8', fillColor: '#00c2e8', fillOpacity: 0.12 }).addTo(map);

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = isDark ? 'בהיר' : 'כהה';

            if (isDark) { map.removeLayer(lightTile); darkTile.addTo(map); }
            else { map.removeLayer(darkTile); lightTile.addTo(map); }
        }

        const pillsContainer = document.getElementById('pillsContainer');
        function scrollPills(amount) { pillsContainer.scrollBy({ left: amount, behavior: 'smooth' }); }
        pillsContainer.addEventListener('wheel', e => { e.preventDefault(); pillsContainer.scrollLeft += e.deltaY; });

        function selectCategory(genre, element) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            if (element) element.classList.add('active');
            selectedGenre = genre;
            searchRestaurants();
        }

        function quickMood(genre) {
            const pill = Array.from(document.querySelectorAll('.pill')).find(p => p.getAttribute('onclick').includes(`'${genre}'`));
            selectCategory(genre, pill);
        }

        function updateCircleLocation(latlng) {
            marker.setLatLng(latlng);
            circle.setLatLng(latlng);
        }

        map.on('click', e => updateCircleLocation(e.latlng));
        marker.on('drag', e => updateCircleLocation(e.target.getLatLng()));

        function locateMe() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(pos => {
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                map.setView(latlng, 14);
                updateCircleLocation(latlng);
                searchRestaurants();
            });
        }

        document.getElementById('radiusSlider').addEventListener('input', e => {
            radius = e.target.value;
            document.getElementById('radiusVal').innerText = Number(radius).toLocaleString() + ' מטר';
            circle.setRadius(radius);
        });

        document.getElementById('ratingSlider').addEventListener('input', e => {
            minRating = e.target.value;
            document.getElementById('ratingVal').innerText = Number(minRating).toFixed(1) + ' ⭐';
        });

        function toggleFavorite(placeJson) {
            const place = JSON.parse(decodeURIComponent(placeJson));
            const idx = favorites.findIndex(f => f.id === place.id);
            if (idx >= 0) { favorites.splice(idx, 1); }
            else { favorites.push(place); }
            localStorage.setItem('sabibi_favs', JSON.stringify(favorites));
            updateFavCount();
            searchRestaurants();
        }

        function shareWhatsApp(name, mapsUrl) {
            const text = encodeURIComponent(`היי! מצאתי ב-Sabibi את "${name}":\n${mapsUrl}`);
            window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
        }

        async function fetchPlaces() {
            const pos = marker.getLatLng();
            const response = await fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ lat: pos.lat, lng: pos.lng, radius: radius, genre: selectedGenre, min_rating: minRating })
            });
            const data = await response.json();
            return data.places || [];
        }

        function renderCardHTML(place) {
            const isFav = favorites.some(f => f.id === place.id);
            const encodedPlace = encodeURIComponent(JSON.stringify(place));

            const imgTag = place.photo_url 
                ? `<img src="${place.photo_url}" class="place-img" alt="${place.name}">`
                : `<div style="width:100%;height:100%;background:var(--control-bg);display:flex;align-items:center;justify-content:center;font-size:32px;">📍</div>`;

            return `
                <div class="place-card">
                    <div class="img-container">
                        ${imgTag}
                        <button class="fav-btn" onclick="toggleFavorite('${encodedPlace}')">${isFav ? '❤️' : '🤍'}</button>
                        <div class="badge-score">🏆 ${place.combined_score}/100</div>
                    </div>
                    <div class="card-body">
                        <h3 class="place-title">${place.name}</h3>
                        <p class="place-subtitle">${place.address}</p>
                        <div class="meta-row">
                            <div class="meta-item">⭐ ${place.google_rating}</div>
                            <div class="meta-item">📍 ${place.distance} מטר</div>
                            <div class="meta-item">🚶 ${place.walk_min} דק'</div>
                        </div>
                        <div class="card-actions">
                            <a href="${place.maps_url}" target="_blank" class="btn-nav">🧭 ניווט ב-Maps</a>
                            <button class="btn-share" onclick="shareWhatsApp('${place.name}', '${place.maps_url}')">📲 שתף</button>
                        </div>
                    </div>
                </div>
            `;
        }

        async function searchRestaurants() {
            const resultsDiv = document.getElementById('results');
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];
            resultsDiv.innerHTML = '<p style="color: var(--primary); font-weight: 700; text-align: center;">מחפש את המקומות הכי שווים...</p>';

            try {
                fetchedPlacesList = await fetchPlaces();

                if (fetchedPlacesList.length > 0) {
                    resultsDiv.innerHTML = '';
                    fetchedPlacesList.forEach(place => {
                        const emoji = icons[selectedGenre] || icons.restaurant;
                        const resMarker = L.marker([place.lat, place.lng], { icon: createEmojiIcon(emoji) })
                            .addTo(map)
                            .bindPopup(`
                                <div style="text-align:right; font-family:'Heebo',sans-serif;">
                                    <h4 style="margin:0 0 4px 0; color:#0f172a;">${place.name}</h4>
                                    <p style="margin:0; font-size:12px; color:#64748b;">${place.address}</p>
                                    <p style="margin:4px 0 0 0; font-size:12px; font-weight:bold; color:#00c2e8;">🏆 מדד סביבי: ${place.combined_score}/100</p>
                                    <a href="${place.maps_url}" target="_blank" style="display:inline-block; margin-top:6px; font-size:12px; color:#2563eb; font-weight:bold;">🧭 נווט בגוגל מפות</a>
                                </div>
                            `);

                        restaurantMarkers.push(resMarker);
                        resultsDiv.innerHTML += renderCardHTML(place);
                    });
                } else {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:var(--text-sub);">לא נמצאו מקומות ברדיוס ובדירוג הזה.</p>';
                }
            } catch (e) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">שגיאה בתקשורת עם השרת.</p>';
            }
        }

        function showFavorites() {
            const resultsDiv = document.getElementById('results');
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];

            if (favorites.length === 0) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:var(--text-sub);">אין לך עדיין מועדפים שמורים.</p>';
                return;
            }

            resultsDiv.innerHTML = `<h3 style="font-size:14px; margin-bottom:12px;">❤️ המועדפים השמורים שלך (${favorites.length}):</h3>`;
            favorites.forEach(place => {
                const emoji = icons[place.genre] || icons.restaurant;
                const resMarker = L.marker([place.lat, place.lng], { icon: createEmojiIcon(emoji) }).addTo(map);
                restaurantMarkers.push(resMarker);
                resultsDiv.innerHTML += renderCardHTML(place);
            });
        }

        /* Wheel Mechanics */
        let wheelItems = [];
        let startAngle = 0;
        let spinTimeout = null;
        let spinAngleStart = 10;
        let spinTime = 0;
        let spinTimeTotal = 0;
        const colors = ['#00c2e8', '#8b5cf6', '#ec4899', '#f59e0b', '#10b981', '#3b82f6'];

        async function openWheelModal() {
            document.getElementById('modalBody').innerHTML = '';
            document.getElementById('spinBtn').style.display = 'block';
            document.getElementById('randomModal').style.display = 'flex';

            if (fetchedPlacesList.length === 0) fetchedPlacesList = await fetchPlaces();
            if (fetchedPlacesList.length === 0) {
                document.getElementById('modalBody').innerHTML = '<p style="color: #ef4444;">לא נמצאו מקומות ברדיוס להגרלה.</p>';
                document.getElementById('spinBtn').style.display = 'none';
                return;
            }

            wheelItems = fetchedPlacesList.slice(0, 6);
            drawWheel();
        }

        function drawWheel() {
            const canvas = document.getElementById('wheelCanvas');
            if (!canvas.getContext) return;
            const ctx = canvas.getContext('2d');
            const outsideRadius = 100, textRadius = 65, insideRadius = 20;

            ctx.clearRect(0, 0, 220, 220);
            const arc = Math.PI / (wheelItems.length / 2);

            for (let i = 0; i < wheelItems.length; i++) {
                const angle = startAngle + i * arc;
                ctx.fillStyle = colors[i % colors.length];

                ctx.beginPath();
                ctx.arc(110, 110, outsideRadius, angle, angle + arc, false);
                ctx.arc(110, 110, insideRadius, angle + arc, angle, true);
                ctx.fill();

                ctx.save();
                ctx.fillStyle = "white";
                ctx.font = "bold 10px Heebo";
                ctx.translate(110 + Math.cos(angle + arc / 2) * textRadius, 110 + Math.sin(angle + arc / 2) * textRadius);
                ctx.rotate(angle + arc / 2 + Math.PI / 2);
                const text = wheelItems[i].name.length > 9 ? wheelItems[i].name.substring(0, 8) + '..' : wheelItems[i].name;
                ctx.fillText(text, -ctx.measureText(text).width / 2, 0);
                ctx.restore();
            }
        }

        function spinWheel() {
            spinAngleStart = Math.random() * 10 + 10;
            spinTime = 0;
            spinTimeTotal = Math.random() * 3000 + 4000;
            rotateWheel();
        }

        function rotateWheel() {
            spinTime += 30;
            if (spinTime >= spinTimeTotal) { stopRotateWheel(); return; }
            const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
            startAngle += (spinAngle * Math.PI / 180);
            drawWheel();
            spinTimeout = setTimeout(rotateWheel, 30);
        }

        function fireConfetti() {
            if (typeof confetti === 'function') {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function stopRotateWheel() {
            clearTimeout(spinTimeout);
            const degrees = startAngle * 180 / Math.PI + 90;
            const arclen = 360 / wheelItems.length;
            const index = Math.floor((360 - degrees % 360) / arclen);
            const winner = wheelItems[(index + wheelItems.length) % wheelItems.length];
            
            document.getElementById('spinBtn').style.display = 'none';
            document.getElementById('modalBody').innerHTML = `
                <div style="margin-top: 10px;">
                    <p style="color: #10b981; font-weight: 800; font-size: 15px; margin-bottom: 6px;">🎉 המזל בחר עבורך:</p>
                    ${renderCardHTML(winner)}
                </div>
            `;
            fireConfetti();
        }

        function easeOut(t, b, c, d) {
            const ts = (t /= d) * t, tc = ts * t;
            return b + c * (tc + -3 * ts + 3 * t);
        }

        /* Improved Multi-User Match Mode Logic */
        let totalUsers = 2;
        let currentUserTurn = 1;
        let matchIndex = 0;
        let matchPlaces = [];
        let votesScores = {}; // מילון נקודות לכל מקום

        async function setupMatchGroup() {
            if (fetchedPlacesList.length === 0) fetchedPlacesList = await fetchPlaces();
            if (fetchedPlacesList.length === 0) return alert('אין מקומות זמינים ברדיוס ל-Match.');

            const num = prompt('כמה משתתפים אתם בקבוצה?', '2');
            if (!num || isNaN(num) || parseInt(num) < 2) {
                totalUsers = 2;
            } else {
                totalUsers = parseInt(num);
            }

            matchPlaces = fetchedPlacesList.slice(0, 5);
            votesScores = {};
            matchPlaces.forEach(p => votesScores[p.id] = 0);

            currentUserTurn = 1;
            matchIndex = 0;

            document.getElementById('matchModal').style.display = 'flex';
            document.getElementById('nextUserBtn').style.display = 'none';
            document.getElementById('matchActions').style.display = 'flex';

            renderMatchCard();
        }

        function renderMatchCard() {
            const body = document.getElementById('matchCardBody');
            const progress = document.getElementById('matchProgress');

            if (matchIndex >= matchPlaces.length) {
                // סיום תור של משתתף יחיד
                document.getElementById('matchActions').style.display = 'none';

                if (currentUserTurn < totalUsers) {
                    progress.innerText = `תור משתתף ${currentUserTurn} מתוך ${totalUsers} הסתיים!`;
                    body.innerHTML = `
                        <div style="padding:15px 0;">
                            <p style="font-size:16px; font-weight:800; color:var(--primary);">סיימת להצביע! 🎉</p>
                            <p style="font-size:13px; color:var(--text-sub);">אנא העבר את המכשיר למשתתף ${currentUserTurn + 1}.</p>
                        </div>
                    `;
                    document.getElementById('nextUserBtn').style.display = 'block';
                } else {
                    // סיום הצבעה של כולן - חישוב המנצח!
                    progress.innerText = `ההצבעה הקבוצתית הסתיימה! 🎉`;
                    let bestPlace = matchPlaces[0];
                    let maxVotes = -1;

                    matchPlaces.forEach(p => {
                        if (votesScores[p.id] > maxVotes) {
                            maxVotes = votesScores[p.id];
                            bestPlace = p;
                        }
                    });

                    body.innerHTML = `
                        <h3 style="color:#10b981; font-size:18px;">🎉 יש Match קבוצתי!</h3>
                        <p style="font-size:13px; color:var(--text-sub); margin-bottom:10px;">
                            המקום שקיבל הכי הרבה קולות מבין ${totalUsers} המשתתפים:
                        </p>
                        ${renderCardHTML(bestPlace)}
                    `;
                    fireConfetti();
                }
                return;
            }

            progress.innerText = `משתתף ${currentUserTurn} מתוך ${totalUsers} | מקום ${matchIndex + 1} מתוך ${matchPlaces.length}`;
            const place = matchPlaces[matchIndex];
            body.innerHTML = renderCardHTML(place);
        }

        function voteMatch(isLike) {
            const place = matchPlaces[matchIndex];
            if (isLike) {
                votesScores[place.id] = (votesScores[place.id] || 0) + 1;
            }
            matchIndex++;
            renderMatchCard();
        }

        function startNextUserTurn() {
            currentUserTurn++;
            matchIndex = 0;
            document.getElementById('nextUserBtn').style.display = 'none';
            document.getElementById('matchActions').style.display = 'flex';
            renderMatchCard();
        }

        function closeModal() { document.getElementById('randomModal').style.display = 'none'; }
        function closeMatchModal() { document.getElementById('matchModal').style.display = 'none'; }

        setTimeout(() => { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
