<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sabibi 📍 סביבי</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #eef2f5; }
        body { display: flex; flex-direction: row; }

        /* Desktop Sidebar */
        #sidebar {
            width: 380px; min-width: 380px; padding: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border-left: 1px solid rgba(0,0,0,0.08);
            z-index: 1000; overflow-y: auto; height: 100vh;
            box-shadow: 4px 0 24px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }

        .brand-header h1 { margin: 0; font-size: 26px; font-weight: 800; color: #1e293b; }

        .form-group { margin-bottom: 16px; }
        label { font-weight: 600; font-size: 14px; color: #334155; display: flex; justify-content: space-between; margin-bottom: 6px; }
        
        select, input[type="range"] {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #cbd5e1; background: #fff; font-size: 14px; outline: none;
        }

        .toggle-container { display: flex; align-items: center; justify-content: space-between; background: #f8fafc; padding: 12px 14px; border-radius: 8px; border: 1px solid #e2e8f0; }

        .btn-location {
            width: 100%; padding: 12px; margin-bottom: 15px; background: #0284c7;
            color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer;
            font-weight: 700; box-shadow: 0 2px 8px rgba(2,132,199,0.2); transition: background 0.2s;
        }
        .btn-location:hover { background: #0369a1; }

        .btn-primary {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #10b981, #059669);
            color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer;
            font-weight: 700; box-shadow: 0 4px 12px rgba(16,185,129,0.25);
        }

        .btn-random {
            width: 100%; padding: 12px; margin-top: 10px; background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white; border: none; border-radius: 10px; font-size: 15px; cursor: pointer;
            font-weight: 700; box-shadow: 0 4px 12px rgba(139,92,246,0.2);
        }

        #map { flex: 1; height: 100vh; width: 100%; z-index: 1; }

        .card {
            background: #ffffff; padding: 14px; border-radius: 12px; margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; position: relative;
        }
        .score-badge { background: #fef3c7; color: #92400e; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12px; display: inline-block; margin-bottom: 8px; }
        .dist-badge { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-size: 12px; margin-left: 6px; }
        .price-badge { background: #f1f5f9; color: #16a34a; padding: 4px 10px; border-radius: 20px; font-weight: 700; font-size: 12px; float: left; }

        .nav-btn {
            display: inline-block; margin-top: 10px; padding: 10px 14px; background: #2563eb; color: white;
            text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; text-align: center; width: 100%;
        }

        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); align-items: center; justify-content: center;
        }
        .modal-content {
            background: white; padding: 24px; border-radius: 16px; width: 90%; max-width: 420px; text-align: center;
        }

        /* Mobile Bottom-Sheet Adaptation */
        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #map { height: 100vh; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
            
            #sidebar {
                width: 100%; min-width: 100%; height: 50vh;
                position: absolute; bottom: 0; left: 0; right: 0;
                border-left: none; border-top-left-radius: 20px; border-top-right-radius: 20px;
                box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
                z-index: 1000; padding: 18px;
            }

            .drag-handle {
                width: 40px; height: 5px; background: #cbd5e1; border-radius: 10px;
                margin: 0 auto 12px auto; cursor: pointer;
            }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="drag-handle"></div>
        <div class="brand-header">
            <h1>📍 Sabibi <span style="font-size:14px; color:#64748b; font-weight:400;">סביבי</span></h1>
        </div>

        <button class="btn-location" onclick="locateMe()">🎯 המיקום הנוכחי שלי</button>

        <div class="form-group">
            <label>רדיוס חיפוש: <span id="radiusVal">1000 מטר</span></label>
            <input type="range" id="radiusSlider" min="200" max="10000" step="100" value="1000">
        </div>

        <div class="form-group">
            <label>סגנון מסעדה:</label>
            <select id="genreSelect">
                <option value="restaurant">הכל 🍽️</option>
                <option value="italian">איטלקי / פיצה 🍕</option>
                <option value="sushi">אסייתי / סושי 🍣</option>
                <option value="meat">בשרים 🥩</option>
                <option value="vegan">טבעוני 🥗</option>
                <option value="cafe">בית קפה ☕</option>
            </select>
        </div>

        <div class="form-group">
            <label>דירוג מינימלי: <span id="ratingVal">4.0 ⭐</span></label>
            <input type="range" id="ratingSlider" min="1" max="5" step="0.1" value="4.0">
        </div>

        <div class="form-group toggle-container">
            <span style="font-weight: 600; font-size: 14px;">פתוח עכשיו בלבד 🕒</span>
            <input type="checkbox" id="openNowCheck">
        </div>

        <button class="btn-primary" onclick="searchRestaurants()">חפש מסעדות בסביבה</button>
        <button class="btn-random" onclick="pickRandomFromAll()">🎲 רעב ולא החלטי? תגריל לי מקום!</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

        <div id="results">
            <p style="color: #94a3b8; font-size: 14px; text-align: center;">לחץ על החיפוש או ההגרלה...</p>
        </div>
    </div>

    <div id="map"></div>

    <div id="randomModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0; color: #6d28d9;">🎉 המקום הנבחר עבורך!</h2>
            <div id="modalBody"></div>
            <button class="btn-primary" style="margin-top: 15px; background: #64748b;" onclick="closeModal()">סגור</button>
        </div>
    </div>

    <script>
        const defaultLat = 32.0853;
        const defaultLng = 34.7818;

        const map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.control.zoom({ position: 'topleft' }).addTo(map);

        let radius = 1000;
        let restaurantMarkers = [];
        let currentPlaces = [];

        const icons = {
            italian: '🍕', sushi: '🍣', meat: '🥩', vegan: '🥗', cafe: '☕', restaurant: '🍽️'
        };

        function createEmojiIcon(emoji) {
            return L.divIcon({
                html: `<div style="font-size: 22px; background: white; border-radius: 50%; padding: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); width: 34px; height: 34px; display:flex; align-items:center; justify-content:center;">${emoji}</div>`,
                className: '', iconSize: [34, 34], iconAnchor: [17, 17]
            });
        }

        let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
        let circle = L.circle([defaultLat, defaultLng], { radius: radius, color: '#2563eb', fillColor: '#3b82f6', fillOpacity: 0.12 }).addTo(map);

        function updateCircleLocation(latlng) {
            marker.setLatLng(latlng);
            circle.setLatLng(latlng);
        }

        map.on('click', e => updateCircleLocation(e.latlng));
        marker.on('drag', e => updateCircleLocation(e.target.getLatLng()));

        function locateMe() {
            if (!navigator.geolocation) {
                alert("הדפדפן שלך אינו תומך בזיהוי מיקום.");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                position => {
                    const userLat = position.coords.latitude;
                    const userLng = position.coords.longitude;
                    const userLatLng = [userLat, userLng];

                    map.setView(userLatLng, 15);
                    updateCircleLocation(userLatLng);
                    searchRestaurants();
                },
                error => {
                    alert("לא ניתן היה לקבל את המיקום שלך. ודא שהרשאת המיקום מופעלת בדפדפן.");
                }
            );
        }

        document.getElementById('radiusSlider').addEventListener('input', e => {
            radius = e.target.value;
            document.getElementById('radiusVal').innerText = radius + ' מטר';
            circle.setRadius(radius);
        });

        document.getElementById('ratingSlider').addEventListener('input', e => {
            document.getElementById('ratingVal').innerText = e.target.value + ' ⭐';
        });

        function clearRestaurantMarkers() {
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];
        }

        async function fetchPlaces(overrideGenre = null) {
            const pos = marker.getLatLng();
            const genre = overrideGenre || document.getElementById('genreSelect').value;
            const minRating = document.getElementById('ratingSlider').value;
            const openNow = document.getElementById('openNowCheck').checked;

            const response = await fetch('http://127.0.0.1:5000/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    lat: pos.lat, lng: pos.lng, radius: radius,
                    genre: genre, min_rating: minRating, open_now: openNow
                })
            });

            const data = await response.json();
            return data.places || [];
        }

        async function searchRestaurants() {
            const resultsDiv = document.getElementById('results');
            clearRestaurantMarkers();
            resultsDiv.innerHTML = '<p style="color: #2563eb; font-weight: 600; text-align: center;">מחפש מסעדות ברדיוס המדויק...</p>';

            try {
                currentPlaces = await fetchPlaces();

                if (currentPlaces.length > 0) {
                    resultsDiv.innerHTML = `<h3 style="font-size:15px; color:#334155;">נמצאו ${currentPlaces.length} מסעדות ברדיוס:</h3>`;

                    currentPlaces.forEach(place => {
                        const emoji = icons[place.genre] || icons.restaurant;
                        
                        const resMarker = L.marker([place.lat, place.lng], { icon: createEmojiIcon(emoji) })
                            .addTo(map)
                            .bindPopup(`<b>${place.name}</b><br>💰 מחיר: ${place.price_display}<br>📏 מרחק: ${place.distance} מטרים<br>🏆 מדד סביבי: ${place.combined_score}/100`);
                        restaurantMarkers.push(resMarker);

                        resultsDiv.innerHTML += `
                            <div class="card">
                                <span class="price-badge">${place.price_display}</span>
                                <span class="dist-badge">📍 ${place.distance} מ'</span>
                                <span class="score-badge">🏆 מדד סביבי: ${place.combined_score}/100</span>
                                <h4 style="margin: 4px 0;">${place.name}</h4>
                                <p style="margin: 0; color: #64748b; font-size: 13px;">${place.address}</p>
                                <p style="margin: 6px 0 0 0; font-size: 12px; color: #475569;">
                                    ⭐ גוגל: <b>${place.google_rating}</b> (${place.user_ratings_total} מדרגים)
                                </p>
                                <a href="${place.maps_url}" target="_blank" class="nav-btn">🧭 נווט ב-Google Maps</a>
                            </div>
                        `;
                    });
                } else {
                    resultsDiv.innerHTML = '<p style="color: #ef4444; text-align: center;">לא נמצאו מסעדות ברדיוס המדויק הזה.</p>';
                }
            } catch (error) {
                resultsDiv.innerHTML = '<p style="color: #ef4444; text-align: center;">שגיאה בתקשורת עם השרת. ודא ש-app.py רץ!</p>';
            }
        }

        async function pickRandomFromAll() {
            const modalBody = document.getElementById('modalBody');
            modalBody.innerHTML = '<p style="color: #6d28d9; font-weight:600;">מגריל מסעדה מכל הסגנונות ברדיוס...</p>';
            document.getElementById('randomModal').style.display = 'flex';

            try {
                const allPlaces = await fetchPlaces("restaurant");

                if (allPlaces.length === 0) {
                    modalBody.innerHTML = '<p style="color: #ef4444;">לא נמצאו מסעדות ברדיוס הזה להגרלה.</p>';
                    return;
                }

                const randomPlace = allPlaces[Math.floor(Math.random() * allPlaces.length)];

                modalBody.innerHTML = `
                    <h3 style="margin-bottom: 5px; color: #1e293b;">${randomPlace.name}</h3>
                    <p style="color: #64748b; font-size: 14px; margin-top:0;">📍 ${randomPlace.address} (${randomPlace.distance} מטרים ממך)</p>
                    <div style="background: #f8fafc; padding: 12px; border-radius: 8px; margin: 15px 0;">
                        <p style="margin: 0; font-size: 16px; font-weight: 700; color: #d97706;">🏆 מדד סביבי: ${randomPlace.combined_score}/100</p>
                        <p style="margin: 5px 0 0 0; font-size: 14px; font-weight: 600; color: #16a34a;">💰 רמת מחיר: ${randomPlace.price_display}</p>
                        <p style="margin: 5px 0 0 0; font-size: 13px; color: #475569;">⭐ גוגל: ${randomPlace.google_rating} (${randomPlace.user_ratings_total} ביקורות)</p>
                    </div>
                    <a href="${randomPlace.maps_url}" target="_blank" class="nav-btn" style="display: block; width: 100%;">🧭 ניווט ישיר למקום</a>
                `;
            } catch (error) {
                modalBody.innerHTML = '<p style="color: #ef4444;">שגיאה בחיבור לשרת.</p>';
            }
        }

        function closeModal() {
            document.getElementById('randomModal').style.display = 'none';
        }

        setTimeout(() => { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
