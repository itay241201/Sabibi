<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sabibi 📍 סביבי - גלה את הסביבה שלך</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-main: #f8fafc;
            --panel-bg: rgba(255, 255, 255, 0.98);
            --primary: #00c2e8;
            --primary-hover: #00a8ca;
            --accent: #8b5cf6;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --card-bg: #ffffff;
            --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --border-radius: 18px;
        }

        * { box-sizing: border-box; font-family: 'Heebo', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; background: var(--bg-main); color: var(--text-main); }
        body { display: flex; flex-direction: row; }

        #sidebar {
            width: 420px; min-width: 420px; padding: 24px;
            background: var(--panel-bg); backdrop-filter: blur(16px);
            border-left: 1px solid rgba(0, 0, 0, 0.05);
            z-index: 1000; overflow-y: auto; height: 100vh;
            box-shadow: 10px 0 30px rgba(0,0,0,0.04);
        }

        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-logo { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; color: var(--text-main); }
        .brand-logo span { color: var(--primary); }

        /* Container for Horizontal Pills with Arrows */
        .pills-wrapper { position: relative; display: flex; align-items: center; margin-bottom: 16px; }
        
        .pills-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px 0; width: 100%;
            scrollbar-width: thin; scroll-behavior: smooth;
        }

        .scroll-btn {
            background: rgba(255,255,255,0.9); border: 1px solid #cbd5e1;
            border-radius: 50%; width: 28px; height: 28px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            font-size: 14px; font-weight: bold; z-index: 10; flex-shrink: 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .pill {
            flex: 0 0 auto; padding: 8px 16px; border-radius: 30px; background: #f1f5f9;
            color: var(--text-sub); font-size: 13px; font-weight: 700; cursor: pointer; border: 1px solid transparent;
            transition: all 0.2s ease; user-select: none;
        }
        .pill.active { background: var(--text-main); color: #fff; }

        .control-card { background: #f8fafc; padding: 16px; border-radius: var(--border-radius); margin-bottom: 16px; border: 1px solid #edf2f7; }
        .control-label { font-size: 13px; font-weight: 700; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 8px; }

        input[type="range"] { width: 100%; accent-color: var(--primary); cursor: pointer; }

        .btn-main {
            width: 100%; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 14px rgba(0, 194, 232, 0.3); transition: transform 0.1s, background 0.2s;
        }
        .btn-main:active { transform: scale(0.98); }

        .btn-secondary {
            width: 100%; padding: 12px; margin-top: 8px; background: #f1f5f9; color: var(--text-main);
            border: none; border-radius: 12px; font-size: 14px; font-weight: 700; cursor: pointer;
        }

        #map { flex: 1; height: 100vh; width: 100%; z-index: 1; }

        .place-card {
            background: var(--card-bg); border-radius: var(--border-radius); padding: 0;
            margin-bottom: 20px; box-shadow: var(--card-shadow); overflow: hidden;
            border: 1px solid #f1f5f9; transition: transform 0.2s ease; position: relative;
        }
        .place-card:hover { transform: translateY(-2px); }

        .img-container { width: 100%; height: 160px; background: #e2e8f0; position: relative; }
        .place-img { width: 100%; height: 100%; object-fit: cover; }

        .badge-score {
            position: absolute; bottom: 12px; right: 12px; background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(8px); color: #fff; padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 800; display: flex; align-items: center; gap: 4px;
        }

        .card-body { padding: 16px; }
        .place-title { font-size: 18px; font-weight: 800; margin: 0 0 4px 0; color: var(--text-main); }
        .place-subtitle { font-size: 13px; color: var(--text-sub); margin: 0 0 12px 0; }

        .meta-row { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .meta-item { display: flex; align-items: center; gap: 4px; background: #f8fafc; padding: 4px 10px; border-radius: 8px; }

        .card-actions { display: flex; gap: 8px; margin-top: 14px; }
        .btn-nav { flex: 1; padding: 10px; background: var(--primary); color: white; border-radius: 10px; text-decoration: none; text-align: center; font-weight: 800; font-size: 13px; }

        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #map { height: 100vh; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
            #sidebar { width: 100%; min-width: 100%; height: 55vh; position: absolute; bottom: 0; left: 0; right: 0; border-left: none; border-top-left-radius: 28px; border-top-right-radius: 28px; padding: 20px; }
            .drag-handle { width: 36px; height: 5px; background: #cbd5e1; border-radius: 10px; margin: 0 auto 16px auto; }
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="drag-handle"></div>
        <div class="header-row">
            <div class="brand-logo">Sabibi<span>.</span></div>
            <button class="btn-secondary" style="margin:0; width:auto; padding:6px 14px;" onclick="locateMe()">🎯 המיקום שלי</button>
        </div>

        <!-- Horizontal Category Pills with Scroll Buttons -->
        <div class="pills-wrapper">
            <button class="scroll-btn" onclick="scrollPills(-120)" style="margin-left: 4px;">›</button>
            <div class="pills-scroll" id="pillsContainer">
                <div class="pill active" onclick="selectCategory('restaurant', this)">🍽️ הכל</div>
                <div class="pill" onclick="selectCategory('kosher', this)">📜 כשר</div>
                <div class="pill" onclick="selectCategory('italian', this)">🍕 איטלקי</div>
                <div class="pill" onclick="selectCategory('sushi', this)">🍣 סושי</div>
                <div class="pill" onclick="selectCategory('meat', this)">🥩 בשרים</div>
                <div class="pill" onclick="selectCategory('cafe', this)">☕ קפה</div>
                <div class="pill" onclick="selectCategory('bar', this)">🍹 בארים</div>
                <div class="pill" onclick="selectCategory('hotel', this)">🏨 מלונות</div>
                <div class="pill" onclick="selectCategory('attraction', this)">🎡 אטרקציות</div>
            </div>
            <button class="scroll-btn" onclick="scrollPills(120)" style="margin-right: 4px;">‹</button>
        </div>

        <div class="control-card">
            <div class="control-label">
                <span>רדיוס חיפוש</span>
                <span id="radiusVal" style="color:var(--primary);">2,000 מטר</span>
            </div>
            <input type="range" id="radiusSlider" min="200" max="15000" step="200" value="2000">

            <div class="control-label" style="margin-top: 14px;">
                <span>דירוג מינימלי</span>
                <span id="ratingVal" style="color:var(--primary);">4.0 ⭐</span>
            </div>
            <input type="range" id="ratingSlider" min="1.0" max="5.0" step="0.1" value="4.0">
        </div>

        <button class="btn-main" onclick="searchRestaurants()">חפש בסביבה</button>
        <button class="btn-secondary" onclick="pickRandomFromAll()">🎲 תגריל לי מקום!</button>

        <hr style="margin: 20px 0; border: none; border-top: 1px solid #f1f5f9;">

        <div id="results">
            <p style="color: var(--text-sub); font-size: 13px; text-align: center;">בחר קטגוריה ולחץ על החיפוש...</p>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const defaultLat = 32.0853;
        const defaultLng = 34.7818;
        let selectedGenre = 'restaurant';

        const map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 14);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let radius = 2000;
        let minRating = 4.0;
        let restaurantMarkers = [];

        let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
        let circle = L.circle([defaultLat, defaultLng], { radius: radius, color: '#00c2e8', fillColor: '#00c2e8', fillOpacity: 0.12 }).addTo(map);

        /* גלילת הסרגל אופקית במחשב בעכבר או בלחיצת חיצים */
        const pillsContainer = document.getElementById('pillsContainer');
        
        function scrollPills(amount) {
            pillsContainer.scrollBy({ left: amount, behavior: 'smooth' });
        }

        pillsContainer.addEventListener('wheel', (e) => {
            e.preventDefault();
            pillsContainer.scrollLeft += e.deltaY;
        });

        function selectCategory(genre, element) {
            document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
            element.classList.add('active');
            selectedGenre = genre;
            searchRestaurants();
        }

        function updateCircleLocation(latlng) {
            marker.setLatLng(latlng);
            circle.setLatLng(latlng);
        }

        map.on('click', e => updateCircleLocation(e.latlng));
        marker.on('drag', e => updateCircleLocation(e.target.getLatLng()));

        function locateMe() {
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(pos => {
                const latlng = [pos.coords.latitude, pos.coords.longitude];
                map.setView(latlng, 14);
                updateCircleLocation(latlng);
                searchRestaurants();
            });
        }

        document.getElementById('radiusSlider').addEventListener('input', e => {
            radius = e.target.value;
            document.getElementById('radiusVal').innerText = Number(radius).toLocaleString() + ' מטר';
            circle.setRadius(radius);
        });

        document.getElementById('ratingSlider').addEventListener('input', e => {
            minRating = e.target.value;
            document.getElementById('ratingVal').innerText = Number(minRating).toFixed(1) + ' ⭐';
        });

        async function searchRestaurants() {
            const resultsDiv = document.getElementById('results');
            restaurantMarkers.forEach(m => map.removeLayer(m));
            restaurantMarkers = [];
            resultsDiv.innerHTML = '<p style="color: var(--primary); font-weight: 700; text-align: center;">מחפש את המקומות הכי שווים...</p>';

            const pos = marker.getLatLng();
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        lat: pos.lat, 
                        lng: pos.lng, 
                        radius: radius, 
                        genre: selectedGenre,
                        min_rating: minRating
                    })
                });

                const data = await response.json();
                const places = data.places || [];

                if (places.length > 0) {
                    resultsDiv.innerHTML = '';
                    places.forEach(place => {
                        const resMarker = L.marker([place.lat, place.lng]).addTo(map);
                        restaurantMarkers.push(resMarker);

                        const imgTag = place.photo_url 
                            ? `<img src="${place.photo_url}" class="place-img" alt="${place.name}">`
                            : `<div style="width:100%;height:100%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-size:32px;">📍</div>`;

                        resultsDiv.innerHTML += `
                            <div class="place-card">
                                <div class="img-container">
                                    ${imgTag}
                                    <div class="badge-score">🏆 ${place.combined_score}/100</div>
                                </div>
                                <div class="card-body">
                                    <h3 class="place-title">${place.name}</h3>
                                    <p class="place-subtitle">${place.address}</p>
                                    <div class="meta-row">
                                        <div class="meta-item">⭐ ${place.google_rating}</div>
                                        <div class="meta-item">📍 ${place.distance} מטר</div>
                                        <div class="meta-item">🚶 ${place.walk_min} דק'</div>
                                    </div>
                                    <div class="card-actions">
                                        <a href="${place.maps_url}" target="_blank" class="btn-nav">🧭 ניווט ב-Maps</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    resultsDiv.innerHTML = '<p style="text-align:center; color:var(--text-sub);">לא נמצאו מקומות ברדיוס ובדירוג הזה.</p>';
                }
            } catch (e) {
                resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">שגיאה בתקשורת עם השרת.</p>';
            }
        }

        setTimeout(() => { map.invalidateSize(); }, 300);
    </script>
</body>
</html>
